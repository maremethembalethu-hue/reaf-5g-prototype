services:

  # ─────────────────────────────────────────────────────────────────────
  #  5G EDGE NODE
  #  Runs inside the UPF network namespace so it can see ogstun traffic.
  #  This is NOT started by docker compose up — start.sh runs it
  #  manually with --network container:upf so it shares the UPF
  #  network namespace directly.
  #
  #  If you want to start it standalone for development only:
  #    docker compose up --build 5g-edge-node
  #  But for full system use start.sh instead.
  # ─────────────────────────────────────────────────────────────────────
  5g-edge-node:
    build: ./5g-edge-node
    container_name: 5g-edge-node
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    privileged: true
    volumes:
      - ./evidence:/evidence
    environment:
      - CAPTURE_INTERFACE=any
      - UE_SUBNET=192.168.100.0/24
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ─────────────────────────────────────────────────────────────────────
  #  IOT TRAFFIC GENERATOR
  #  Also NOT started by docker compose — start.sh runs it with
  #  --network container:nr_ue so it shares the UE network namespace
  #  and can send traffic through uesimtun0.
  # ─────────────────────────────────────────────────────────────────────
  iot-traffic-generator:
    build: ./iot-traffic-generator
    container_name: iot-traffic-generator
    cap_add:
      - NET_ADMIN
    environment:
      - UE_TUNNEL_IFACE=uesimtun0
      - TARGET_IP=192.168.100.1
    restart: unless-stopped